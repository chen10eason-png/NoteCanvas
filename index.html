<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f8" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>NoteCanvas</title>
<style>
:root{
  --bg:#f6f6f7; --panel:#fff; --panel2:#fafafa; --ink:#1f2329; --muted:#777d87;
  --line:#e7e7e9; --blue:#2f6fed; --blue2:#eaf1ff; --shadow:0 12px 35px rgba(29,35,50,.09);
  --radius:14px; --navw:232px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select{font:inherit}
button{color:inherit}
.hidden{display:none!important}
.app{height:100dvh;display:flex;background:var(--bg)}

/* ---------- Library ---------- */
.library{display:flex;width:100%;height:100%}
.lib-side{width:var(--navw);background:#fbfbfc;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-weight:750;font-size:20px;letter-spacing:-.4px}
.logo-mark{width:31px;height:31px;border-radius:9px;background:linear-gradient(145deg,#2f6fed,#6b8fff);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 6px 16px rgba(47,111,237,.23)}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{height:42px;border:none;background:transparent;border-radius:10px;padding:0 11px;display:flex;align-items:center;gap:11px;cursor:pointer;font-weight:560;text-align:left}
.navbtn:hover{background:#f1f1f3}.navbtn.active{background:#eceff5;color:#1f4da8}
.navbtn svg{width:19px;height:19px;stroke-width:1.8}
.side-bottom{margin-top:auto;padding:9px 8px;color:var(--muted);font-size:12px;line-height:1.5}
.lib-main{flex:1;min-width:0;display:flex;flex-direction:column;background:white}
.lib-top{height:68px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid #f0f0f1}
.lib-title{font-size:24px;font-weight:760;letter-spacing:-.5px}
.grow{flex:1}
.search{width:min(360px,38vw);height:39px;border:1px solid var(--line);background:#f7f7f8;border-radius:10px;padding:0 12px 0 38px;outline:none}
.search-wrap{position:relative}.search-wrap .icon{position:absolute;left:12px;top:10px;color:#9096a0}
.pillbtn,.sqbtn{border:1px solid var(--line);background:#fff;border-radius:10px;height:39px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:600}
.pillbtn:hover,.sqbtn:hover{background:#f7f7f8}.pillbtn.primary{background:#2f6fed;border-color:#2f6fed;color:#fff}
.sqbtn{width:39px;padding:0}
.lib-content{padding:28px 30px 36px;overflow:auto}
.section-head{display:flex;align-items:center;margin-bottom:14px}.section-title{font-size:16px;font-weight:720}.subtle{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:22px 18px;margin-bottom:32px}
.card{min-width:0;cursor:pointer;user-select:none;position:relative}
.card:hover .cover{transform:translateY(-2px);box-shadow:0 13px 27px rgba(20,30,50,.12)}
.cover{aspect-ratio:4/5;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,50,.08);transition:.18s;background:#e9edf6;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.05)}
.cover.book:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.09)}
.cover.book .label{position:absolute;left:14px;right:14px;top:42%;padding:12px 7px;border-radius:3px;background:rgba(255,255,255,.92);text-align:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.cover.folder{aspect-ratio:1.2/1;background:transparent;border:none;box-shadow:none;overflow:visible;margin-top:30px}
.folder-shape{height:105px;border-radius:8px;background:linear-gradient(#f0be52,#e7a832);position:relative;box-shadow:0 8px 20px rgba(122,88,22,.16)}
.folder-shape:before{content:"";position:absolute;width:56%;height:22px;top:-10px;left:0;border-radius:8px 8px 0 0;background:#f2c45c}
.card-title{font-size:13.5px;font-weight:650;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.star{position:absolute;right:9px;top:9px;width:28px;height:28px;border:none;border-radius:8px;background:rgba(255,255,255,.87);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;transition:.16s;cursor:pointer}
.card:hover .star,.star.on{opacity:1}.star.on{color:#e4a51b}
.new-card .cover{display:grid;place-items:center;border:1.5px dashed #cbd2de;background:#fafbfc;box-shadow:none}
.plus-circle{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eef4ff;color:var(--blue);font-size:29px;font-weight:300}

/* ---------- Editor ---------- */
.editor{display:none;width:100%;height:100%;flex-direction:column;background:#eceef1}
.docbar{height:54px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;z-index:20}
.doc-title{font-size:14px;font-weight:650;padding:0 8px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.iconbtn{height:36px;min-width:36px;border:none;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;padding:0 9px}
.iconbtn:hover{background:#f2f3f5}.iconbtn.active{background:#eef3ff;color:#275cc9}
.iconbtn svg{width:19px;height:19px;stroke-width:1.8}
.mode-switch{height:34px;border:1px solid var(--line);background:#f7f7f8;border-radius:9px;padding:3px;display:flex}
.mode-switch button{border:none;background:transparent;border-radius:6px;padding:0 11px;font-size:12px;cursor:pointer;color:#666}
.mode-switch button.active{background:white;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.09)}

.toolrow{height:58px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:8px 12px;z-index:18;overflow-x:auto;overflow-y:hidden}
.toolrow::-webkit-scrollbar{display:none}
.toolgroup{height:42px;display:flex;align-items:center;gap:3px;padding:3px;border-radius:12px;background:#f5f5f6;flex:0 0 auto}
.tool{height:36px;min-width:38px;border:none;background:transparent;border-radius:9px;display:flex;align-items:center;gap:6px;justify-content:center;padding:0 10px;cursor:pointer;font-size:12px;font-weight:650;color:#4c5159}
.tool:hover{background:#eceef2}.tool.active{background:#fff;color:#1f55c6;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tool svg{width:19px;height:19px;stroke-width:1.8}
.tooldot{width:18px;height:18px;border-radius:50%;background:#1c1e22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}

.active-menu{min-height:46px;background:rgba(250,250,251,.98);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 16px;z-index:17;overflow-x:auto}
.active-menu::-webkit-scrollbar{display:none}
.menu-label{font-size:12px;color:#767b84;font-weight:650;white-space:nowrap}.chip{height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip.active{border-color:#b9ccfb;background:#eef4ff;color:#2456bc}
.widthchip{width:34px;height:30px;border:1px solid var(--line);background:white;border-radius:8px;display:grid;place-items:center;cursor:pointer}.widthchip.active{border-color:#9bb6f1;background:#eef4ff}
.widthline{width:20px;background:#222;border-radius:8px}
.colorchip{width:28px;height:28px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #c9cbd0;cursor:pointer;flex:0 0 auto}.colorchip.active{box-shadow:0 0 0 2px #2f6fed}

.docbody{flex:1;min-height:0;display:flex;position:relative}
.page-side{width:236px;background:#fafafa;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:12;transition:.18s}
.page-side.closed{width:0;overflow:hidden;border-right:0}
.side-tabs{height:48px;display:flex;align-items:end;padding:0 12px;border-bottom:1px solid var(--line);gap:18px;min-width:236px}
.side-tab{height:48px;border:none;background:transparent;font-size:12px;color:#6e737d;font-weight:650;position:relative;cursor:pointer}.side-tab.active{color:#20242a}.side-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#2f6fed;border-radius:2px}
.page-list{padding:14px 14px 24px;overflow:auto;min-width:236px}
.page-thumb-wrap{display:grid;grid-template-columns:22px 1fr;gap:7px;align-items:start;margin-bottom:14px}
.page-num{font-size:11px;color:#8c919a;padding-top:5px;text-align:right}
.page-thumb{aspect-ratio:3/4;background:white;border:1px solid #d8d9dd;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden;cursor:pointer;position:relative}
.page-thumb.active{outline:2px solid #4d7ee5;outline-offset:1px}.page-thumb canvas{width:100%;height:100%;display:block}
.add-side-page{width:100%;height:38px;border:1px dashed #bfc4cd;background:#fff;border-radius:9px;color:#5d6470;cursor:pointer}
.outline-empty,.audio-empty{padding:28px 14px;text-align:center;color:#8b9099;font-size:12px;line-height:1.55;min-width:236px}

.stage-wrap{flex:1;min-width:0;min-height:0;overflow:auto;position:relative;background:#e9eaed;overscroll-behavior:contain}
.stage{min-width:960px;min-height:1260px;padding:36px 72px 80px;display:flex;justify-content:center;align-items:flex-start;transform-origin:top center}
.paper{width:816px;height:1088px;background:#fff;box-shadow:0 8px 28px rgba(20,25,35,.12);position:relative;overflow:hidden;touch-action:none}
.paper[data-paper="grid"]{background-image:linear-gradient(#e9edf4 1px,transparent 1px),linear-gradient(90deg,#e9edf4 1px,transparent 1px);background-size:27px 27px}
.paper[data-paper="ruled"]{background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 31px,#dfe5ef 32px)}
.paper[data-paper="dot"]{background-image:radial-gradient(#cbd1dc 1px,transparent 1.2px);background-size:24px 24px}
.paper[data-paper="blank"]{background-image:none}
#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#textLayer{position:absolute;inset:0;pointer-events:none}
.textbox{position:absolute;min-width:130px;min-height:32px;padding:4px 6px;border-radius:4px;outline:1px dashed transparent;pointer-events:auto;white-space:pre-wrap;word-break:break-word}
.textbox:focus{outline-color:#7898dc;background:rgba(255,255,255,.35)}
.zoomdock{position:fixed;right:18px;bottom:18px;height:38px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.08);display:flex;align-items:center;z-index:30;overflow:hidden}
.zoomdock button{width:38px;height:38px;border:none;background:transparent;cursor:pointer}.zoomdock span{width:54px;text-align:center;font-size:12px;color:#646a73}

/* ---------- Menus / modal / toast ---------- */
.pop{position:fixed;z-index:100;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.14);padding:7px;min-width:190px}
.pop button{width:100%;height:37px;border:none;background:transparent;border-radius:8px;padding:0 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px}.pop button:hover{background:#f4f5f7}
.overlay{position:fixed;inset:0;background:rgba(20,22,28,.23);backdrop-filter:blur(2px);z-index:150;display:grid;place-items:center;padding:18px}
.modal{width:min(660px,95vw);max-height:90vh;background:white;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.2);overflow:auto}
.modal-head{padding:20px 22px 14px;font-size:19px;font-weight:750;display:flex;align-items:center}.modal-body{padding:4px 22px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.field{margin:12px 0}.field label{display:block;font-size:12px;color:#6f7580;font-weight:650;margin-bottom:7px}.field input{width:100%;height:41px;border:1px solid #dcdde1;border-radius:10px;padding:0 12px;outline:none}.field input:focus{border-color:#7da1f3;box-shadow:0 0 0 3px #edf3ff}
.cover-picks,.paper-picks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.coverpick{aspect-ratio:4/5;border-radius:7px;border:2px solid transparent;cursor:pointer;position:relative;box-shadow:0 3px 9px rgba(0,0,0,.08)}.coverpick.active,.paperpick.active{border-color:#2f6fed;box-shadow:0 0 0 3px #eaf1ff}.paperpick{aspect-ratio:3/4;background:#fff;border:1px solid #d9dce2;border-radius:5px;cursor:pointer;position:relative}.paperpick span{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;color:#777}
.paperpick.grid{background-image:linear-gradient(#e8ecf3 1px,transparent 1px),linear-gradient(90deg,#e8ecf3 1px,transparent 1px);background-size:9px 9px}.paperpick.ruled{background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 10px,#e2e6ed 11px)}.paperpick.dot{background-image:radial-gradient(#cbd1dc .7px,transparent .8px);background-size:8px 8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#20242a;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:300}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  :root{--navw:210px}.lib-side{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-102%);transition:.2s;box-shadow:var(--shadow)}.lib-side.open{transform:translateX(0)}
  .lib-top{padding:0 14px}.lib-content{padding:20px 16px}.lib-title{font-size:21px}.search-wrap{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px}
  .doc-title{max-width:140px}.page-side{position:absolute;left:0;top:0;bottom:0;box-shadow:10px 0 30px rgba(0,0,0,.08)}.page-side.closed{transform:translateX(-100%);width:236px}
  .stage{padding:28px 28px 70px;min-width:870px}.active-menu{padding-left:10px}.zoomdock{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- Library -->
  <section class="library" id="library">
    <aside class="lib-side" id="libSide">
      <div class="logo"><div class="logo-mark">N</div>NoteCanvas</div>
      <nav class="nav">
        <button class="navbtn active" data-view="documents" data-icon="docs">文件</button>
        <button class="navbtn" data-view="favorites" data-icon="star">我的最愛</button>
        <button class="navbtn" data-view="search" data-icon="search">搜尋</button>
        <button class="navbtn" data-view="shared" data-icon="users">共享</button>
      </nav>
      <div class="side-bottom">本機模式 · 自動儲存<br>資料保留在這台裝置的瀏覽器</div>
    </aside>
    <main class="lib-main">
      <header class="lib-top">
        <button class="sqbtn mobile-menu hidden" id="mobileMenu" data-icon="menu"></button>
        <div class="lib-title" id="libTitle">文件</div>
        <div class="grow"></div>
        <div class="search-wrap"><span class="icon" id="searchIcon"></span><input class="search" id="searchBox" placeholder="搜尋筆記本與資料夾"></div>
        <button class="sqbtn" id="sortBtn" title="排序" data-icon="sort"></button>
        <button class="pillbtn primary" id="newBtn" data-icon="plus">新增</button>
      </header>
      <div class="lib-content" id="libContent"></div>
    </main>
  </section>

  <!-- Editor -->
  <section class="editor" id="editor">
    <header class="docbar">
      <button class="iconbtn" id="backBtn" title="回到文件" data-icon="back"></button>
      <button class="iconbtn active" id="sidebarBtn" title="側邊欄" data-icon="sidebar"></button>
      <div class="doc-title" id="docTitle">筆記本</div>
      <div class="grow"></div>
      <button class="iconbtn" id="undoBtn" title="復原" data-icon="undo"></button>
      <button class="iconbtn" id="redoBtn" title="重做" data-icon="redo"></button>
      <div class="mode-switch"><button class="active" id="editMode">編輯</button><button id="readMode">閱讀</button></div>
      <button class="iconbtn" id="addPageTop" title="新增頁面" data-icon="pageplus"></button>
      <button class="iconbtn" id="exportBtn" title="分享與匯出" data-icon="share"></button>
      <button class="iconbtn" id="moreBtn" title="更多" data-icon="more"></button>
    </header>

    <div class="toolrow" id="toolrow">
      <div class="toolgroup">
        <button class="tool" data-tool="lasso" data-icon="lasso">套索</button>
        <button class="tool active" data-tool="pen" data-icon="pen">書寫</button>
        <button class="tool" data-tool="eraser" data-icon="eraser">橡皮擦</button>
        <button class="tool" data-tool="highlighter" data-icon="highlight">螢光筆</button>
      </div>
      <div class="toolgroup">
        <button class="tool" data-tool="shape" data-icon="shape">圖形</button>
        <button class="tool" data-tool="image" data-icon="image">圖片</button>
        <button class="tool" data-tool="text" data-icon="text">文字</button>
        <button class="tool" data-tool="laser" data-icon="laser">雷射</button>
      </div>
      <div class="grow"></div>
      <div class="toolgroup" style="background:transparent">
        <button class="tool" id="quickColor"><span class="tooldot" id="quickDot"></span></button>
      </div>
    </div>
    <div class="active-menu" id="activeMenu"></div>

    <div class="docbody">
      <aside class="page-side" id="pageSide">
        <div class="side-tabs"><button class="side-tab active" data-tab="pages">頁面</button><button class="side-tab" data-tab="outline">大綱</button><button class="side-tab" data-tab="audio">錄音</button></div>
        <div class="page-list" id="pageList"></div>
      </aside>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage"><div class="paper" id="paper" data-paper="grid"><canvas id="ink" width="816" height="1088"></canvas><div id="textLayer"></div></div></div>
      </div>
    </div>
    <div class="zoomdock"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button></div>
  </section>
</div>

<input type="file" id="imageInput" accept="image/*" class="hidden">
<div id="pop" class="pop hidden"></div>
<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast"></div>

<script>
// ---------- icon system ----------
const ICONS={
 docs:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/>',
 star:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9L12 3z"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>', users:'<path d="M16 19v-1.4a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V19"/><circle cx="9.5" cy="7" r="3"/><path d="M17 10a3 3 0 0 0 0-6M21 19v-1.5a4 4 0 0 0-3-3.7"/>',
 sort:'<path d="M8 6h12M8 12h8M8 18h4"/><path d="m3 8 2-2 2 2M5 6v12"/>',plus:'<path d="M12 5v14M5 12h14"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',back:'<path d="m15 18-6-6 6-6"/>',
 sidebar:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',undo:'<path d="M9 7H5v-4"/><path d="M5 7c3-3 7-4 10-2 4 2 5 7 3 11-2 3-6 5-10 3"/>',redo:'<path d="M15 7h4v-4"/><path d="M19 7c-3-3-7-4-10-2-4 2-5 7-3 11 2 3 6 5 10 3"/>',
 pageplus:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',share:'<path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 lasso:'<path d="M7 5c-4 1-5 5-3 8 2 3 7 4 11 3 5-1 7-4 5-7-2-4-8-5-13-4z" stroke-dasharray="2 2"/><path d="M16 16c0 3-1 5-3 5-1 0-2-1-2-2 0-1 1-2 3-2"/>',
 pen:'<path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20z"/><path d="m13.5 6.5 3.5 3.5"/>',eraser:'<path d="m4 15 8-10 7 6-7 9H8z"/><path d="m9 20 5-6"/>',highlight:'<path d="m5 18 9-12 5 4-9 12z"/><path d="M3 21h14"/>',
 shape:'<rect x="4" y="5" width="8" height="8" rx="1"/><circle cx="16" cy="15" r="4"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 20"/>',text:'<path d="M5 5h14M12 5v14M8 19h8"/>',laser:'<path d="M12 3v4M4.2 6.2 7 9M3 14h4M21 14h-4M19.8 6.2 17 9"/><circle cx="12" cy="14" r="3"/>',

 } else if(tool==='laser'){

function addColors(m){const lab=document.createElement('span');lab.className='menu-label';lab.textContent='顏色';m.appendChild(lab);['#1d1f23','#2f6fed','#e84b4b','#2f9b68','#a45ad4'].forEach(c=>{const d=document.createElement('button');d.className='colorchip'+(color===c?' active':'');d.style.background=c;d.onclick=()=>{color=c;renderActiveMenu()};m.appendChild(d)});const input=document.createElement('input');input.type='color';input.value=color;input.className='colorchip';input.title='自訂顏色';input.oninput=()=>{color=input.value;renderActiveMenu()};m.appendChild(input)}

function pushUndo(){undo.push({image:canvas.toDataURL(),texts:textLayer.innerHTML});if(undo.length>40)undo.shift();redo=[]}
function restore(s){ctx.clearRect(0,0,canvas.width,canvas.height);textLayer.innerHTML=s.texts;bindTextBoxes();if(s.image){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=s.image}}
$('#undoBtn').onclick=()=>{if(!undo.length)return;redo.push({image:canvas.toDataURL(),texts:textLayer.innerHTML});restore(undo.pop());persist()};
$('#redoBtn').onclick=()=>{if(!redo.length)return;undo.push({image:canvas.toDataURL(),texts:textLayer.innerHTML});restore(redo.pop());persist()};
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height,pressure:e.pressure||.5}}
canvas.addEventListener('pointerdown',e=>{
 if(readOnly)return;
 const p=pos(e);
 if(tool==='text'){pushUndo();addText(p.x,p.y,'輸入文字',color,22,500,true);persist();return}
 if(tool==='lasso'){toast('目前套索先保留介面；可直接拖曳文字物件');return}
 drawing=true;canvas.setPointerCapture?.(e.pointerId);last=p;shapeStart=p;if(tool!=='laser')pushUndo();if(tool==='shape')shapeBase=ctx.getImageData(0,0,canvas.width,canvas.height);
 if(tool==='laser')drawLaser(p);
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing||readOnly)return;const p=pos(e);
 if(tool==='laser'){drawLaser(p);last=p;return}
 if(tool==='shape'){ctx.putImageData(shapeBase,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=penSize;ctx.strokeRect(shapeStart.x,shapeStart.y,p.x-shapeStart.x,p.y-shapeStart.y);return}
 ctx.lineCap='round';ctx.lineJoin='round';
 if(tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.lineWidth=eraserMode==='precision'?14:eraserMode==='standard'?28:50}
 else {ctx.globalCompositeOperation='source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='highlighter'?.23:1;let pressure=(e.pointerType==='pen'?Math.max(.25,p.pressure):.75);let mult=penStyle==='fountain'?1.15:penStyle==='brush'?1.5:1;ctx.lineWidth=(tool==='highlighter'?penSize*5:penSize*mult*(.75+pressure*.55))}
 ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;last=p;
});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{if(!drawing)return;drawing=false;shapeBase=null;if(tool!=='laser')persist()}));
let laserTimer;function drawLaser(p){ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(235,55,55,.85)';ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.restore();clearTimeout(laserTimer);laserTimer=setTimeout(()=>loadPage(),120)}

function addText(x,y,text,c,size,weight=400,focus=false){const el=document.createElement('div');el.className='textbox';el.contentEditable='true';el.innerText=text;Object.assign(el.style,{left:x+'px',top:y+'px',color:c,fontSize:size+'px',fontWeight:weight});textLayer.appendChild(el);bindText(el);if(focus){el.focus();document.execCommand?.('selectAll',false,null)}}
function bindText(el){let sx,sy,ox,oy,moved=false;el.oninput=()=>persist();el.onpointerdown=e=>{if(readOnly)return;if(tool==='lasso'){moved=true;sx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0;el.setPointerCapture?.(e.pointerId);e.preventDefault()}};el.onpointermove=e=>{if(moved&&tool==='lasso'){el.style.left=ox+(e.clientX-sx)/zoom+'px';el.style.top=oy+(e.clientY-sy)/zoom+'px'}};el.onpointerup=()=>{if(moved){moved=false;persist()}}}
function bindTextBoxes(){textLayer.querySelectorAll('.textbox').forEach(bindText)}

$('#imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;pushUndo();const img=new Image();img.onload=()=>{const maxW=520,maxH=650;let w=img.width,h=img.height;const k=Math.min(maxW/w,maxH/h,1);w*=k;h*=k;ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);persist();toast('圖片已加入');URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);e.target.value=''};
function clearPage(){if(!confirm('清除目前頁面的手寫、文字與圖片？'))return;pushUndo();ctx.clearRect(0,0,canvas.width,canvas.height);textLayer.innerHTML='';persist();renderPageSide()}

function drawPaper(c,w,h,type){c.fillStyle='#fff';c.fillRect(0,0,w,h);c.strokeStyle='#e7ebf1';c.lineWidth=.6;if(type==='grid'){for(let x=0;x<w;x+=10){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=0;y<h;y+=10){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}else if(type==='ruled'){for(let y=8;y<h;y+=12){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}else if(type==='dot'){c.fillStyle='#cbd1dc';for(let x=6;x<w;x+=10)for(let y=6;y<h;y+=10){c.beginPath();c.arc(x,y,.45,0,7);c.fill()}}}
function exportPNG(){snapshotPage();const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d');drawPaper(c,out.width,out.height,currentPage().paper);c.drawImage(canvas,0,0);[...textLayer.querySelectorAll('.textbox')].forEach(el=>{c.fillStyle=el.style.color||'#222';c.font=`${el.style.fontWeight||400} ${parseFloat(el.style.fontSize)||20}px -apple-system, sans-serif`;const x=parseFloat(el.style.left)||0;let y=(parseFloat(el.style.top)||0)+(parseFloat(el.style.fontSize)||20);el.innerText.split('\n').forEach(line=>{c.fillText(line,x,y);y+=(parseFloat(el.style.fontSize)||20)*1.25})});const a=document.createElement('a');a.download=(currentBook.title||'note')+'-page-'+(currentPageIndex+1)+'.png';a.href=out.toDataURL('image/png');a.click();toast('已匯出 PNG')}

// zoom
function setZoom(z){zoom=Math.min(1.5,Math.max(.65,z));$('#stage').style.transform=`scale(${zoom})`;$('#stage').style.marginBottom=((zoom-1)*1088)+'px';$('#zoomLabel').textContent=Math.round(zoom*100)+'%'}
$('#zoomIn').onclick=()=>setZoom(zoom+.1);$('#zoomOut').onclick=()=>setZoom(zoom-.1);

// mobile menu
function checkMobile(){if(innerWidth<=900){$('#mobileMenu').classList.remove('hidden')}else{$('#mobileMenu').classList.add('hidden');$('#libSide').classList.remove('open')}}
window.addEventListener('resize',checkMobile);checkMobile();$('#mobileMenu').onclick=()=>$('#libSide').classList.toggle('open');

// save before leave
window.addEventListener('beforeunload',persist);
renderLibrary();renderActiveMenu();
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
